<script>
  (function () {
    var APPSTORE = 'https://apps.apple.com/app/id6778556946';
    var PLAY = 'https://play.google.com/store/apps/details?id=gg.kalibre.kalibre';
    var ua = navigator.userAgent || navigator.vendor || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);
    try {
      if (isIOS) { location.replace(APPSTORE); }
      else if (isAndroid) { location.replace(PLAY); }
    } catch (e) {}
  })();
</script>
